<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15151b">
  <title>Kazuji Reader</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.6 system-ui, sans-serif; background: #15151b; color: #f6f3fa; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(34rem, calc(100% - 3rem)); padding: 2rem 0; }
    h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 8vw, 3.25rem); }
    p { color: #cbc6d2; }
    .button { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border-radius: .75rem; background: #c8a5ff; color: #20172b; font-weight: 650; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Kazuji Reader</h1>
    <p>Leia e acompanhe seus mangás no Kazuji.</p>
    <a class="button" href="https://github.com/Kazuji-Reader/Kazuji/releases/latest">Baixar o Kazuji</a>
  </main>
</body>
</html>
